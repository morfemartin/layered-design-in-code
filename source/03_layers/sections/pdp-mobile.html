<!doctype html>
<!-- Static mobile product excerpt from arrive-aruba-shopify-theme@e8fc788. -->
<html class="js" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link rel="stylesheet" href="../../02_source/pdp-github-e8fc788/assets/critical.css">
<link rel="stylesheet" href="../../02_source/pdp-github-e8fc788/assets/theme.css">
<style>
  @font-face{font-family:'Geologica';src:url('../../02_source/pdp-github-e8fc788/assets/geologica-variable.woff2') format('woff2');font-weight:100 900}
  @font-face{font-family:'ArriveLegacy';src:url('../../02_source/pdp-github-e8fc788/assets/arrive-legacy-medium.woff2') format('woff2');font-weight:500}
  @font-face{font-family:'ArriveLegacy';src:url('../../02_source/pdp-github-e8fc788/assets/arrive-legacy-book-italic.woff2') format('woff2');font-weight:400;font-style:italic}
  @font-face{font-family:'PortBlair';src:url('../../02_source/pdp-github-e8fc788/assets/arrive-port-blair.woff2') format('woff2');font-weight:400}
  :root{
    --aa-sapphire:#386395;--aa-sapphire-dark:#23405E;--aa-navy:#2C4F78;--aa-lake:#5F8BB8;
    --aa-cream:#F0F0E5;--aa-orange:#F5A169;--aa-green:#92AF88;--aa-ink:#17202A;
    --aa-page-width:1440px;--aa-side-space:clamp(1rem,3.5vw,3.5rem);--aa-radius:0px;
    --aa-body-font:'Geologica',system-ui,sans-serif;--aa-serif-font:'ArriveLegacy',Georgia,serif;--aa-display-font:'PortBlair','ArriveLegacy',serif;
  }
  html,body{margin:0;width:390px;overflow:hidden}

</style>
<style>
  html, body,
  .template-product .site-main,
  .main-product,
  .main-product .product-media { background: transparent; }
  .main-product { min-height: 100vh; }
  .product-pdp-nav { display: flex; }
  .product-media { aspect-ratio: 1; }
  .product-info .product-title { font-size: 30px; }
  .pdp-summary .product-card-price .price { font-size: 17px; }
  .pdp-summary {
    display: flex;
    align-items: center;
    min-height: 39px;
    margin-top: 12px;
  }
  .pdp-summary .product-badges--pdp {
    position: absolute;
    right: 25px;
    bottom: 25px;
    margin: 0;
    perspective: 380px;
    perspective-origin: right center;
  }
  .pdp-summary .product-badge--upf {
    font-size: 19px;
    transform: translateZ(60px);
    transform-origin: right center;
  }
</style>
</head>
<body class="template-product motion-enabled">
<main id="MainContent" class="site-main">
<!-- Réplica estática de la PDP móvil (sections/product.liquid + product-badges + product-feature-icon) para el Performance Piqué Polo -->
<section class="main-product">
  <div class="product-pdp-nav">
    <a class="product-nav-button product-back" href="#" aria-label="Back to collection"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.5"/></svg></a>
    <div class="product-pdp-actions">
      <button class="product-nav-button product-save" type="button" aria-label="Save product"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.8 4.7a5.4 5.4 0 0 0-7.7 0L12 5.8l-1.1-1.1a5.4 5.4 0 0 0-7.7 7.7l1.1 1.1L12 21l7.7-7.5 1.1-1.1a5.4 5.4 0 0 0 0-7.7Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="product-nav-button product-nav-cart" type="button" aria-label="Open cart"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z" stroke="currentColor" stroke-width="1.5"/><path d="M9 9V6a3 3 0 0 1 6 0v3" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </div>
  </div>
  <div class="product-layout" style="--product-media-fit:contain">
    <product-gallery class="product-gallery"><div class="product-media-list" data-media-track><div class="product-media is-active" data-product-media>
      <img src="../../02_source/media/arrive-aruba-performance-pique-polo-blue-front.png" alt="Performance Piqué Polo" width="1080" height="1350">
    </div></div></product-gallery>
    <div class="product-info"><div class="product-info-inner">
      <div class="product-card-top"><p class="eyebrow">Polo / Arrive Aruba</p><div class="product-chips"><span class="product-chip">Regular fit</span></div></div>
      <h1 class="product-title">Performance Piqué Polo</h1>
      <div class="pdp-summary">
        <div class="product-card-price">
          <div class="price" data-price>
            <span data-product-price>$85.00</span>
            <span class="price-compare" data-product-compare hidden></span>
          </div>
        </div>
        <div class="product-badges product-badges--pdp" id="upf"><span class="product-badge product-badge--upf"><svg class="product-feature-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>UPF 50+</span></span></div>
      </div>
    </div></div>
  </div>
</section>
</main>
</body></html>
